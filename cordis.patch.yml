# DSH 插件 bundle patch：插件被加入任意 profile（插件页安装、CLI 安装）时自动并入组合配置。
# 顶层条目按 id 覆盖更早层（内置模板/其他 bundle）的插件行；本插件自己的新行放 insert。
# 平台地址直接内建（公开地址，非机密）；换平台时重新发布本仓库，或用 profile 级 patch 按 id 覆盖：
#   - id: harness-auth
#     config:
#       platformBaseUrl: https://<另一个平台地址>
- id: credentials
  disabled: false
- id: session-telemetry-otel
  disabled: true
- id: session-title-llm
  disabled: true
- id: llm-pi-ai
  config:
    providers:
      harness:
        displayName: Harness Platform
        apiKeyEnv: HARNESS_PLATFORM_TOKEN
        api: openai-completions
        baseURL: https://43-134-117-172.nip.io/v1
        models:
          - { id: work, name: work, contextWindow: 200000, maxTokens: 8192, input: [text] }
          - { id: cheap, name: cheap, contextWindow: 200000, maxTokens: 8192, input: [text] }
- id: agent-default-model
  config:
    provider: harness
    model: work
- insert:
    - id: harness-auth
      name: "@harness/dsh-plugin-auth"
      config:
        platformBaseUrl: https://43-134-117-172.nip.io
